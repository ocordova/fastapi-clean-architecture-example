# Docker Compose configuration for running tests in CI/CD
# For local development, tests should run against local PostgreSQL
# See README.md "Testing" section for local setup instructions

services:
  postgres:
    container_name: postgres-test
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: api-test
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    env_file:
      - .env.test
    tty: true
    depends_on:
      - postgres
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
